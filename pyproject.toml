[project]
name = "jarvis"
version = "0.1.0"
description = "Jarvis: a personal AI assistant with a custom agent loop, approvals and memory"
readme = "README.md"
authors = [
    { name = "Arel Raba"}
]
requires-python = ">=3.13"
dependencies = [
    "keyring>=25.7.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
jarvis = "jarvis:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
# fakes lives in tests/, where ruff can't detect it as ours.
known-first-party = ["jarvis", "fakes"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
# .claude/hooks: the pr-reviewer guard hook, so CI type-checks it.
files = ["src", "tests", ".claude/hooks"]
# Spikes are throwaway code, exempt from mypy (docs/plan/phase-1-voice-spike.md).
exclude = ["^spikes/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Spikes have no tests and are never collected, even by a bare `pytest .`.
addopts = "-ra --ignore=spikes"
