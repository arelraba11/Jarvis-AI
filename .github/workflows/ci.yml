name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      # Runs ruff, ruff format, mypy and the file hygiene hooks
      - run: uv run pre-commit run --all-files --show-diff-on-failure
      - run: uv run pytest
