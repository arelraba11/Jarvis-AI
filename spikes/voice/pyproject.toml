[project]
name = "jarvis-voice-spike"
version = "0.1.0"
description = "Phase 1 throwaway spike: Hebrew voice, realtime vs pipeline"
requires-python = ">=3.13,<3.14"
dependencies = [
    "google-genai>=2.25.0",
    "keyring>=25.7.0",
    "numpy>=2.5.3",
    "pyyaml>=6.0.3",
    "sounddevice>=0.5.6",
]

# A plain script project, not an installable package.
[tool.uv]
package = false
